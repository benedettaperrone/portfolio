<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Benedetta Perrone</title>
  <!-- This repository exists only to keep old links working. The site moved
       from https://benedettaperrone.github.io/portfolio/ to
       https://benedettaperrone.github.io/ in October 2026.
       The script sends every old address to the same page at the new one
       (/portfolio/cv.html -> /cv.html). The meta refresh is the fallback for
       browsers without JavaScript, and goes to the home page. -->
  <script>
    (function () {
      var path = location.pathname.replace(/^\/portfolio/, "") || "/";
      location.replace("https://benedettaperrone.github.io" + path + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://benedettaperrone.github.io/" />
  <link rel="canonical" href="https://benedettaperrone.github.io/" />
</head>
<body>
  <p>This site has moved to <a href="https://benedettaperrone.github.io/">benedettaperrone.github.io</a>.</p>
</body>
</html>
